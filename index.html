<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>梦幻小镇 · Merge Story</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    /* 加载画面 */
    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #fdf6e3, #f5e6d3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-screen h1 {
      font-size: 28px;
      color: #5a3e2b;
      margin-bottom: 8px;
    }
    #loading-screen p {
      color: #999;
      font-size: 14px;
    }
    .loading-emoji {
      font-size: 48px;
      margin-bottom: 16px;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <!-- 加载画面 -->
  <div id="loading-screen">
    <div class="loading-emoji">🏘️</div>
    <h1>梦幻小镇</h1>
    <p>正在加载...</p>
  </div>

  <!-- 游戏容器 -->
  <div id="game-container">
    <!-- 顶部状态栏 -->
    <div id="top-bar"></div>

    <!-- 主区域 -->
    <div id="main-area">
      <!-- 订单面板 -->
      <div id="order-panel"></div>

      <!-- 棋盘 -->
      <div id="grid-container"></div>
    </div>

    <!-- 生成器栏 -->
    <div id="generator-bar"></div>

    <!-- 底部操作栏 -->
    <div id="action-bar">
      <button id="btn-shop" class="action-btn">🏪 商店</button>
      <button id="btn-save" class="action-btn">💾 保存</button>
      <button id="btn-reset" class="action-btn">🔄 重置</button>
    </div>
  </div>

  <!-- 物品操作菜单 -->
  <div id="item-menu" class="hidden"></div>

  <!-- 商店弹窗 -->
  <div id="shop-modal" class="hidden"></div>

  <!-- Toast 提示 -->
  <div id="toast" class="hidden"></div>

  <!-- 奖励弹窗 -->
  <div id="reward-toast" class="hidden"></div>

  <!-- 脚本 -->
  <script src="js/GameState.js"></script>
  <script src="js/Grid.js"></script>
  <script src="js/Generator.js"></script>
  <script src="js/Order.js"></script>
  <script src="js/SaveManager.js"></script>
  <script src="js/UI.js"></script>
  <script src="js/main.js"></script>
  <script>
    // 隐藏加载画面
    setTimeout(() => {
      document.getElementById('loading-screen').classList.add('hidden');
    }, 500);
  </script>
</body>
</html>
