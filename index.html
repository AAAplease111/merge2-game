<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>梦幻小镇 · Merge Story</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="game-container">
    <!-- 顶部状态栏 -->
    <div id="top-bar"></div>

    <!-- 主区域 -->
    <div id="main-area">
      <!-- 订单面板 -->
      <div id="order-panel"></div>
      <!-- 棋盘 -->
      <div id="grid-container"></div>
    </div>

    <!-- 生成器栏 -->
    <div id="generator-bar"></div>

    <!-- 底部操作栏 -->
    <div id="action-bar">
      <button class="action-btn" id="btn-shop">🏪 商店</button>
      <button class="action-btn" id="btn-save">💾 保存</button>
      <button class="action-btn" id="btn-reset">🔄 重置</button>
    </div>
  </div>

  <!-- 物品操作菜单 -->
  <div id="item-menu" class="hidden"></div>

  <!-- 商店弹窗 -->
  <div id="shop-modal" class="hidden"></div>

  <!-- Toast -->
  <div id="toast" class="hidden"></div>

  <!-- 奖励弹窗 -->
  <div id="reward-toast" class="hidden"></div>

  <!-- 脚本 -->
  <script src="js/GameState.js"></script>
  <script src="js/Grid.js"></script>
  <script src="js/Generator.js"></script>
  <script src="js/Order.js"></script>
  <script src="js/SaveManager.js"></script>
  <script src="js/UI.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
